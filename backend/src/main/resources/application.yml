spring:
  sql:
    init:
      mode: always
  datasource:
    username: ${DB_USER}
    url: ${DB_URL}
    password: ${DB_PASSWORD}
  application:
    name: comic-tracker
  jpa:
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: 'true'
  mvc:
    problemdetails:
      enabled: true

jwt:
  sign-key: ${JWT_SIGN_KEY}
  issuer: comic-tracker
  audience: comic-tracker
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30
  # Ventana de validez del token cuando el login no pidió "recordarme"
  refresh-token-session-expiration-hours: 24
  refresh-token-secure: true

scalar:
  # default values, not needed, but nice to remember
  enabled: true
  path: /scalar

olympus:
  # default value, not needed, but scanlation sites like this one change domain
  # fairly often (to dodge blocking), so this is the first thing to override if it goes stale.
  base-url: https://olympusxyz.com

comic:
  metadata:
    # Passive TTL: a comic's metadata is only re-fetched from the active provider once this long
    # has passed (no scheduled job).
    ttl: 24h
    # On a failed refresh attempt, retried this soon instead of waiting a full ttl.
    retry-backoff: 15m
  reading-entry:
    # Shorter than comic.metadata.ttl: chapter counts are more time-sensitive, and these sites
    # are less reliable, so backoff below is longer than metadata's.
    ttl: 6h
    retry-backoff: 30m

resilience4j:
  ratelimiter:
    instances:
      # Tenrai's per-second and per-minute caps for the current (public) tier, enforced
      # as two stacked limiters. Daily cap (40000/day) is documented but not enforced here.
      # resilience4j's RateLimiter is a fixed window counter, so a burst straddling a window
      # boundary can briefly reach ~2x limit-for-period - each pair below is scaled down from
      # the real cap (not 4/1s or 120/1m directly) to bound that overshoot, while keeping rpm's
      # window well above rps's so it still acts as a longer sustained-average budget.
      tenrai-rps:
        limit-for-period: 1
        limit-refresh-period: 250ms
        timeout-duration: 2s
      tenrai-rpm:
        limit-for-period: 20
        limit-refresh-period: 10s
        timeout-duration: 2s
      # Olympus's own Mihon/Tachiyomi extension documents these caps client-side (1 req/2s on the
      # main domain, 2 req/s on the panel. API subdomain).
      # Checked empirically: the site itself doesn't appear to enforce any hard rate limit and
      # handles well above these numbers (tested up to 16 req/s) without issue - these are a
      # deliberately conservative self-imposed courtesy limit, not a defensive measure against a
      # real 429. olympus-panel is scaled down (1/500ms, not 2/1s) because of fixed-window boundary-burst.
      olympus-base:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 2s
      olympus-panel:
        limit-for-period: 1
        limit-refresh-period: 500ms
        timeout-duration: 2s