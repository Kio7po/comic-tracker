<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Colors the browser's UI (e.g. the mobile address bar) to match the app's header. A single
      tag whose content is switched by JS rather than two prefers-color-scheme tags, because the
      theme can be forced independently of the OS setting. data-light/data-dark are the only
      place these values are kept for JS: the script below and ThemeProvider.tsx both read them.
      They must match --card in index.css (:root and .dark), converted to hex. Declared before
      the script so it can find it.
    -->
    <meta name="theme-color" content="#f7f8fc" data-light="#f7f8fc" data-dark="#252629" />
    <!--
      Applies the stored theme before the browser's first paint (a synchronous, blocking
      inline script - no type="module", no defer/async), so there's no flash of the default
      light theme while the JS bundle loads and React mounts. Key/value shape ('theme',
      JSON-stringified) must stay in sync with THEME_STORAGE_KEY in ThemeProvider.tsx.
    -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const theme = stored ? JSON.parse(stored) : 'system';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.content = isDark ? themeColor.dataset.dark : themeColor.dataset.light;
          }
        } catch {
          // localStorage disabled/unavailable - fall back to the default light theme.
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manganamao</title>
    <!--
      Static, English-only: this is a client-rendered SPA, so crawlers and link previews only
      ever see this document, not a per-route or per-language one.
      TODO: og:image and og:url need an absolute URL, so they wait for a real domain.
      TODO: language-specific indexable versions (e.g. /es/ routes) so each language can surface
      in its own search results.
    -->
    <meta
      name="description"
      content="Find where to read comics and manga online: a community-built catalog of reading sources, plus your own reading tracker."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manganamao" />
    <meta property="og:title" content="Manganamao" />
    <meta
      property="og:description"
      content="Find where to read comics and manga online: a community-built catalog of reading sources, plus your own reading tracker."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
